events { worker_connections 1024; }
http {
  server_tokens off;
  client_max_body_size 20m;
  server {
    listen 80 default_server;
    server_name 109.235.118.171;
    location /api/ {
      proxy_pass http://backend:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /downloads/ {
      alias /downloads/;
      types { application/vnd.android.package-archive apk; }
      default_type application/octet-stream;
      autoindex off;
      add_header Content-Disposition attachment;
      add_header X-Content-Type-Options nosniff;
    }
    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
  server {
    listen 80;
    server_name bio.app.kz;
    location ^~ /.well-known/acme-challenge/ { root /acme; }
    location / { return 308 https://bio.app.kz$request_uri; }
  }
  server {
    listen 443 ssl;
    server_name bio.app.kz;
    ssl_certificate /etc/letsencrypt/live/bio.app.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bio.app.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /api/ {
      proxy_pass http://backend:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Preserve the signed S3 URI and Host; do not strip the bucket prefix.
    location ^~ /bioflow-test/ {
      proxy_pass http://s3:8333;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /downloads/ {
      alias /downloads/;
      types { application/vnd.android.package-archive apk; }
      default_type application/octet-stream;
      autoindex off;
      add_header Content-Disposition attachment;
      add_header X-Content-Type-Options nosniff;
    }
    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
