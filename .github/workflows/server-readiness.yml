name: server-readiness
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Readiness operation (restores only disposable backup copies)"
        type: choice
        required: true
        options: [inspect, verify-backup, enable-https, finish-collection, create-collection-test-owner]
      collection_ref:
        description: "Existing Collection release commit, required only for finish-collection"
        required: false
      account_envelope:
        description: "AGE encrypted test-owner request; never enter plaintext phone or credentials"
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: production-ops
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PROD_SSH_HOST: "109.235.118.171"
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER || 'root' }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SSHPASS: ${{ secrets.PROD_SSH_PASSWORD }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
      - run: command -v sshpass >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y sshpass)
      - name: Inspect server without business data mutations
        if: inputs.operation == 'inspect'
        run: |
          source infrastructure/ci-ssh.sh
          bioflow_ssh 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "deployed=$(cat /opt/bioflow-test/current/DEPLOYED_COMMIT)"
          getent ahostsv4 bio.app.kz || echo 'DNS bio.app.kz: missing'
          echo 'Public DNS (independent of server /etc/hosts):'
          curl --fail --silent --show-error --max-time 20 -H 'Accept: application/dns-json' 'https://cloudflare-dns.com/dns-query?name=bio.app.kz&type=A' || echo 'Public DNS query unavailable'
          echo
          systemctl is-active bioflow-test-backup.timer
          echo "paired_file_backups=$(find /opt/bioflow-test/backups -maxdepth 1 -name 'bioflow-test-*-files.tgz' -type f | wc -l)"
          docker ps --format '{{.Names}} {{.Status}}'
          df -h /opt/bioflow-test
          REMOTE
      - name: Run reviewed server preparation or restore verification
        if: inputs.operation != 'inspect' && inputs.operation != 'finish-collection' && inputs.operation != 'create-collection-test-owner'
        run: |
          source infrastructure/ci-ssh.sh
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          target="/opt/bioflow-test/verification/$GITHUB_SHA"
          bioflow_ssh "mkdir -p '$target/nginx' && chmod 700 '$target'"
          bioflow_scp infrastructure/verify-test-backup.sh infrastructure/verify-restored-files.cjs infrastructure/create-restore-probe.cjs infrastructure/enable-test-https.sh infrastructure/renew-test-https.sh "$PROD_SSH_USER@$PROD_SSH_HOST:$target/"
          bioflow_scp infrastructure/nginx/test-server-https.conf "$PROD_SSH_USER@$PROD_SSH_HOST:$target/nginx/"
          case "$OPERATION" in
            verify-backup) bioflow_ssh bash "$target/verify-test-backup.sh" ;;
            enable-https) bioflow_ssh bash "$target/enable-test-https.sh" ;;
            *) exit 2 ;;
          esac
      - name: Require CI for the existing Collection application release
        if: inputs.operation == 'finish-collection'
        uses: actions/github-script@v7
        env:
          COLLECTION_REF: ${{ inputs.collection_ref }}
        with:
          script: |
            const sha=process.env.COLLECTION_REF;
            if (!/^[0-9a-f]{40}$/.test(sha)) return core.setFailed('Exact existing Collection commit required');
            const {data}=await github.rest.actions.listWorkflowRuns({owner:context.repo.owner,repo:context.repo.repo,workflow_id:'ci.yml',head_sha:sha,per_page:30});
            if (!data.workflow_runs.some(run=>run.conclusion==='success')) core.setFailed('Existing application must have passed CI');
      - name: Finish isolated Collection routing without rebuilding mobile apps
        if: inputs.operation == 'finish-collection'
        env:
          COLLECTION_REF: ${{ inputs.collection_ref }}
        run: |
          set -euo pipefail
          [[ "$COLLECTION_REF" =~ ^[0-9a-f]{40}$ ]]
          source infrastructure/ci-ssh.sh
          bioflow_ssh "test -f /opt/collection-live/releases/$COLLECTION_REF/docker-compose.collection.yml && mkdir -p /opt/collection-live/tools"
          bioflow_scp infrastructure/deploy-collection.sh "$PROD_SSH_USER@$PROD_SSH_HOST:/opt/collection-live/tools/deploy-collection.sh"
          bioflow_ssh "bash /opt/collection-live/tools/deploy-collection.sh /opt/collection-live/releases/$COLLECTION_REF"
          curl --fail --retry 6 --retry-all-errors --retry-delay 2 https://release.109.235.118.171.sslip.io/api/v1/health
          curl --fail http://109.235.118.171/api/v1/health
      - name: Create explicitly requested Collection test owner from encrypted stdin
        if: inputs.operation == 'create-collection-test-owner'
        env:
          ACCOUNT_ENVELOPE: ${{ inputs.account_envelope }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT_ENVELOPE"
          source infrastructure/ci-ssh.sh
          bioflow_ssh "test -x /opt/collection-live/tools/age && docker inspect collection-live-backend-1 >/dev/null"
          bioflow_scp infrastructure/create-collection-test-owner.cjs "$PROD_SSH_USER@$PROD_SSH_HOST:/opt/collection-live/tools/create-collection-test-owner.cjs"
          bioflow_ssh "docker cp /opt/collection-live/tools/create-collection-test-owner.cjs collection-live-backend-1:/tmp/create-collection-test-owner.cjs"
          printf '%s' "$ACCOUNT_ENVELOPE" | bioflow_ssh "bash -o pipefail -c '/opt/collection-live/tools/age --decrypt --identity /etc/ssh/ssh_host_ed25519_key | docker exec -i collection-live-backend-1 node /tmp/create-collection-test-owner.cjs'"
      - name: Remove temporary account helper from the application container
        if: always() && inputs.operation == 'create-collection-test-owner'
        run: |
          source infrastructure/ci-ssh.sh
          bioflow_ssh "docker exec collection-live-backend-1 rm -f /tmp/create-collection-test-owner.cjs"
