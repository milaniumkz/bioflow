---
name: Full ARM64 CI Verification
'on':
  push:
    branches:
    - codex/arm64-ci-pilot
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build-test:
    needs: native-node
    runs-on:
    - milanium-linux-arm64
    - repo-bioflow
    steps:
    - uses: actions/checkout@v4
    - name: Download generated OpenAPI from the required native validation
      uses: actions/download-artifact@v4
      with:
        name: bioflow-openapi
        path: packages/api-client/openapi
    - run: docker compose config
    - run: docker build --platform linux/arm64 -f apps/backend/Dockerfile .
    - run: docker build --platform linux/arm64 -f apps/web/Dockerfile .
    timeout-minutes: 45
    if: github.repository == 'milaniumkz/bioflow' && github.ref == 'refs/heads/codex/arm64-ci-pilot'
  native-node:
    runs-on: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/codex/arm64-ci-pilot') && fromJSON('["milanium-mac-arm64",
      "repo-bioflow"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      CI: 'true'
      DATABASE_URL: ''
      REDIS_URL: ''
      PROMO_TEST_DATABASE_URL: ''
      COREPACK_ENABLE_NETWORK: "${{ github.event_name != 'pull_request' && (github.ref
        == 'refs/heads/main' || github.ref == 'refs/heads/codex/arm64-ci-pilot') &&
        '0' || '1' }}"
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main'
        && github.ref != 'refs/heads/codex/arm64-ci-pilot')
      with:
        node-version: '24'
        cache: npm
    - name: Select existing Node 24
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main'
        || github.ref == 'refs/heads/codex/arm64-ci-pilot')
      run: |
        echo /opt/homebrew/bin >> "$GITHUB_PATH"
        test "$(/opt/homebrew/bin/node -p 'process.versions.node.split(".")[0]')" = 24
    - run: npm ci
    - run: npm run prisma:generate
    - run: npm run lint
    - run: npm test
    - run: npm test -w @bioflow/backend -- --detectOpenHandles --runInBand
    - name: Generate OpenAPI without a real database connection
      run: DATABASE_URL='postgresql://bioflow:bioflow@127.0.0.1:9/bioflow?schema=public'
        npm run openapi:generate
    - run: npm run build
    - run: npm audit --omit=dev --audit-level=high
    - uses: actions/upload-artifact@v4
      with:
        name: bioflow-openapi
        path: packages/api-client/openapi
        if-no-files-found: error
        retention-days: 1
    if: github.repository == 'milaniumkz/bioflow' && github.ref == 'refs/heads/codex/arm64-ci-pilot'
  native-mobile:
    needs: native-node
    if: github.repository == 'milaniumkz/bioflow' && github.ref == 'refs/heads/codex/arm64-ci-pilot'
      && (github.repository == 'milaniumkz/bioflow' && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/arm64-ci-pilot'))
    runs-on:
    - milanium-mac-arm64
    - repo-bioflow
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select existing Flutter 3.41.1
      run: |
        echo /Volumes/PD1000/job/flutter/bin >> "$GITHUB_PATH"
        /Volumes/PD1000/job/flutter/bin/flutter --version --machine | python3 -c 'import json,sys; assert json.load(sys.stdin)["frameworkVersion"] == "3.41.1"'
    - run: flutter pub get --enforce-lockfile
    - run: flutter analyze
    - run: flutter test
