name: android-ui
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/backend/test/ui-fixture.ts"
      - ".github/workflows/android-ui.yml"
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bioflow_android_ui_spec
          POSTGRES_USER: bioflow
          POSTGRES_PASSWORD: bioflow-ui-test-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bioflow -d bioflow_android_ui_spec" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bioflow:bioflow-ui-test-only@localhost:5432/bioflow_android_ui_spec?schema=public
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      PORT: 4100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run prisma:generate && npm run prisma:deploy && npm run seed
      - run: npx tsx apps/backend/test/ui-fixture.ts && npm run build -w @bioflow/backend
      - name: Start isolated API
        run: |
          nohup node apps/backend/dist/main.js > "$RUNNER_TEMP/android-ui-api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:4100/api/v1/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python3 infrastructure/android-network-test-control.py > "$RUNNER_TEMP/android-network-control.log" 2>&1 &
            control_pid=$!
            trap 'kill "$control_pid" 2>/dev/null || true; adb shell svc wifi enable; adb shell svc data enable' EXIT
            cd apps/mobile
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/user_journeys_test.dart --dart-define=API_URL=http://10.0.2.2:4100/api/v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BIOFLOW-Android-UI-evidence
          path: |
            apps/mobile/artifacts
            ${{ runner.temp }}/android-ui-api.log
            ${{ runner.temp }}/android-network-control.log
          if-no-files-found: warn
          retention-days: 14
