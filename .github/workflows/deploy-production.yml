name: deploy-production

on:
  workflow_run:
    workflows: ["ci"]
    branches: ["main"]
    types: ["completed"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to deploy"
        required: false
        default: "main"
      contour:
        description: "Deployment target; Collection uses separate database and volumes"
        type: choice
        options: [legacy, collection]
        default: legacy
      asset_tag:
        description: "Collection APK release tag"
        required: false
      server_config_age:
        description: "Optional AGE envelope encrypted to the pinned server host key"
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && inputs.contour != 'collection') || (github.event.workflow_run.conclusion == 'success' && vars.PROD_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST || '109.235.118.171' }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER || 'root' }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SSHPASS: ${{ secrets.PROD_SSH_PASSWORD }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH || '/opt/bioflow' }}
      PROD_APP_URL: ${{ secrets.PROD_APP_URL || 'https://bio.app.kz' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for this commit
        uses: actions/github-script@v7
        env:
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'ci.yml', head_sha: process.env.DEPLOY_SHA, per_page: 30
            });
            if (!data.workflow_runs.some(run => run.conclusion === 'success')) {
              core.setFailed('This commit must pass the ci workflow before deployment.');
            }

      - name: Install password SSH support
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass

      - name: Package release
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude='**/node_modules' \
            --exclude=dist \
            --exclude='**/dist' \
            --exclude=.next \
            --exclude='**/.next' \
            --exclude=.env \
            --exclude='.env.*' \
            --exclude=backups \
            --exclude=secrets \
            --exclude=certificates \
            --exclude='bioflow-*.tgz' \
            -czf "bioflow-${{ steps.commit.outputs.sha }}.tgz" .

      - name: Upload release
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          source infrastructure/ci-ssh.sh
          [[ "$PROD_DEPLOY_PATH" =~ ^/[A-Za-z0-9/_-]+$ ]]
          bioflow_ssh \
            "mkdir -p '$PROD_DEPLOY_PATH/incoming' '$PROD_DEPLOY_PATH/releases' '$PROD_DEPLOY_PATH/backups' '$PROD_DEPLOY_PATH/shared'"
          bioflow_scp "bioflow-${{ steps.commit.outputs.sha }}.tgz" \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/incoming/"

      - name: Deploy release
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          source infrastructure/ci-ssh.sh
          [[ "$PROD_DEPLOY_PATH" =~ ^/[A-Za-z0-9/_-]+$ ]]
          bioflow_ssh bash -s -- "$PROD_DEPLOY_PATH" "$SHA" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH=$1
          SHA=$2
          RELEASE="$DEPLOY_PATH/releases/$SHA"
          ARCHIVE="$DEPLOY_PATH/incoming/bioflow-$SHA.tgz"
          mkdir -p "$RELEASE" "$DEPLOY_PATH/backups"
          tar -xzf "$ARCHIVE" -C "$RELEASE"
          PREVIOUS=$(readlink -f "$DEPLOY_PATH/current" || true)
          if ! bash "$RELEASE/infrastructure/deploy-release.sh" "$RELEASE" "$DEPLOY_PATH/shared" "$DEPLOY_PATH/backups"; then
            if [ -n "$PREVIOUS" ] && [ -f "$PREVIOUS/docker-compose.production.yml" ]; then
              (cd "$PREVIOUS" && docker compose -p bioflow-production -f docker-compose.production.yml up -d --build)
            fi
            exit 1
          fi
          ln -sfn "$RELEASE" "$DEPLOY_PATH/current"
          printf '%s\n' "$SHA" > "$RELEASE/DEPLOYED_COMMIT"
          REMOTE

      - name: Verify health
        run: |
          curl --fail --retry 12 --retry-delay 5 "$PROD_APP_URL/api/v1/health"

  collection:
    if: github.event_name == 'workflow_dispatch' && inputs.contour == 'collection'
    runs-on: ubuntu-latest
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST || '109.235.118.171' }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER || 'root' }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SSHPASS: ${{ secrets.PROD_SSH_PASSWORD }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Require CI for this exact Collection commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = require('child_process').execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
            const {data} = await github.rest.actions.listWorkflowRuns({owner:context.repo.owner,repo:context.repo.repo,workflow_id:'ci.yml',head_sha:sha,per_page:30});
            if (!data.workflow_runs.some(run=>run.conclusion==='success')) core.setFailed('Collection commit must pass CI before deployment.');
      - name: Prepare isolated release and APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_TAG: ${{ inputs.asset_tag }}
        run: |
          set -euo pipefail
          [[ "$ASSET_TAG" =~ ^collection-live-[A-Za-z0-9._-]+$ ]]
          sudo apt-get update -qq && sudo apt-get install -y sshpass
          mkdir -p "$RUNNER_TEMP/collection-apks"
          gh release download "$ASSET_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'collection-apks.part-*' --pattern SHA256SUMS --dir "$RUNNER_TEMP/collection-apks"
          cat "$RUNNER_TEMP/collection-apks"/collection-apks.part-* > "$RUNNER_TEMP/collection-apks.tar.gz"
          python3 - "$RUNNER_TEMP/collection-apks.tar.gz" "$RUNNER_TEMP/collection-apks" <<'PYCODE'
          import sys,tarfile
          with tarfile.open(sys.argv[1]) as tar:
              members=tar.getmembers()
              assert {m.name for m in members} == {'Collection.apk','Collection-Driver.apk'}
              assert all(m.isfile() for m in members)
              tar.extractall(sys.argv[2],members=members,filter='data')
          PYCODE
          (cd "$RUNNER_TEMP/collection-apks" && sha256sum -c SHA256SUMS)
          test -s "$RUNNER_TEMP/collection-apks/Collection.apk"
          test -s "$RUNNER_TEMP/collection-apks/Collection-Driver.apk"
          sha=$(git rev-parse HEAD)
          git archive --format=tar.gz -o "$RUNNER_TEMP/collection-source.tgz" HEAD
          source infrastructure/ci-ssh.sh
          bioflow_ssh "mkdir -p /opt/collection-live/releases/$sha /opt/collection-live/shared/downloads /opt/collection-live/incoming"
          bioflow_scp "$RUNNER_TEMP/collection-source.tgz" "$PROD_SSH_USER@$PROD_SSH_HOST:/opt/collection-live/incoming/$sha.tgz"
          bioflow_scp "$RUNNER_TEMP/collection-apks/Collection.apk" "$RUNNER_TEMP/collection-apks/Collection-Driver.apk" "$PROD_SSH_USER@$PROD_SSH_HOST:/opt/collection-live/shared/downloads/"
          bioflow_ssh "tar -xzf /opt/collection-live/incoming/$sha.tgz -C /opt/collection-live/releases/$sha"
      - name: Install encrypted Firebase configuration
        if: inputs.server_config_age != ''
        env:
          SERVER_CONFIG_AGE: ${{ inputs.server_config_age }}
        run: |
          set -euo pipefail
          umask 077
          envelope="$RUNNER_TEMP/collection-config.age"
          trap 'rm -f "$envelope"' EXIT
          printf '%s' "$SERVER_CONFIG_AGE" > "$envelope"
          sha=$(git rev-parse HEAD)
          source infrastructure/ci-ssh.sh
          bioflow_ssh "bash /opt/collection-live/releases/$sha/infrastructure/install-collection-config.sh" < "$envelope"
      - name: Deploy separate Collection database and application
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          source infrastructure/ci-ssh.sh
          bioflow_ssh "bash /opt/collection-live/releases/$sha/infrastructure/deploy-collection.sh /opt/collection-live/releases/$sha"
      - name: Verify new public link and old contour
        run: |
          curl --fail --retry 8 --retry-delay 5 https://release.109.235.118.171.sslip.io/api/v1/health
          curl --fail --retry 8 --retry-delay 5 https://release.109.235.118.171.sslip.io/collection -o /dev/null
          curl --fail --retry 8 --retry-delay 5 http://109.235.118.171/api/v1/health
