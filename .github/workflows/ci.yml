name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bioflow_spec
          POSTGRES_USER: bioflow
          POSTGRES_PASSWORD: bioflow
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bioflow" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://bioflow:bioflow@localhost:5432/bioflow_spec?schema=public
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: bioflow
      S3_ACCESS_KEY: bioflow-local
      S3_SECRET_KEY: bioflow-local-development-only
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy && npm run seed
      - run: npm run lint && npm test && npm run build
      - run: npm run openapi:generate
      - run: |
          docker run -d --name bioflow-ci-s3 -p 9000:8333 -v "$PWD/infrastructure/s3-development.json:/etc/seaweed/s3.json:ro" chrislusf/seaweedfs:3.85 server -s3 -s3.config=/etc/seaweed/s3.json -ip=localhost -ip.bind=0.0.0.0
          for attempt in $(seq 1 30); do
            if npm run s3:init -w @bioflow/backend; then break; fi
            sleep 2
          done
          npm run s3:init -w @bioflow/backend
          PORT=4100 npm run start -w @bioflow/backend > /tmp/bioflow-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4100/api/v1/health; then break; fi
            sleep 2
          done
          npm run test:acceptance -w @bioflow/backend
      - run: npm audit --omit=dev --audit-level=high
      - run: docker compose config --quiet
      - run: cp .env.production.example .env.production && docker compose -f docker-compose.production.yml config --quiet
      - run: docker build -f apps/backend/Dockerfile . && docker build -f apps/web/Dockerfile .
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get && flutter analyze && flutter test && flutter build apk --debug --dart-define=API_URL=http://10.0.2.2:4000/api/v1
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: BIOFLOW-test-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
