name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm test
      - run: npm test -w @bioflow/backend -- --detectOpenHandles --runInBand
      - run: DATABASE_URL='postgresql://bioflow:bioflow@localhost:5432/bioflow?schema=public' npm run openapi:generate
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: docker compose config
      - run: docker build -f apps/backend/Dockerfile .
      - run: docker build -f apps/web/Dockerfile .
