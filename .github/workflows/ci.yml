name: ci
on:
  push:
    branches-ignore: [codex/mac-ci-pilot, codex/ci-split-pilot]
  pull_request:
jobs:
  build-test:
    needs: native-node
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bioflow_spec
          POSTGRES_USER: bioflow
          POSTGRES_PASSWORD: bioflow
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bioflow -d bioflow_spec" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://bioflow:bioflow@localhost:5432/bioflow_spec?schema=public
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: bioflow
      S3_ACCESS_KEY: bioflow-local
      S3_SECRET_KEY: bioflow-local-development-only
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy && npm run seed
      - run: npm run lint && npm test && npm run build
      - run: npm run openapi:generate
      - run: |
          docker run -d --name bioflow-ci-s3 -p 9000:8333 -v "$PWD/infrastructure/s3-development.json:/etc/seaweed/s3.json:ro" chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d server -dir=/data -master.volumeSizeLimitMB=100 -volume.max=8 -s3 -s3.config=/etc/seaweed/s3.json -ip=127.0.0.1 -ip.bind=0.0.0.0
          for attempt in $(seq 1 30); do
            if npm run s3:init -w @bioflow/backend; then break; fi
            sleep 2
          done
          npm run s3:init -w @bioflow/backend
          PORT=4100 npm run start -w @bioflow/backend > /tmp/bioflow-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4100/api/v1/health; then break; fi
            sleep 2
          done
          npm run test:acceptance -w @bioflow/backend
      - run: npm audit --omit=dev --audit-level=high
      - run: docker compose config --quiet
      - run: cp .env.production.example .env.production && docker compose -f docker-compose.production.yml config --quiet
      - name: Validate isolated server configuration
        run: |
          mkdir -p /tmp/bioflow-compose-check
          cp .env.production.example /tmp/bioflow-compose-check/server.env
          BIOFLOW_SHARED_DIR=/tmp/bioflow-compose-check BIOFLOW_IMAGE_TAG=validation POSTGRES_PASSWORD=validation docker compose -f docker-compose.test-server.yml config --quiet
          bash -n infrastructure/ci-ssh.sh infrastructure/launch-test-server.sh
      - run: docker build -f apps/backend/Dockerfile . && docker build -f apps/web/Dockerfile .
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get && flutter analyze && flutter test && flutter build apk --debug --dart-define=API_URL=http://10.0.2.2:4000/api/v1
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: BIOFLOW-test-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk

  native-node:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      DATABASE_URL: ""
      REDIS_URL: ""
      PROMO_TEST_DATABASE_URL: ""
      COREPACK_ENABLE_NETWORK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm test
      - run: npm test -w @bioflow/backend -- --detectOpenHandles --runInBand
      - name: Generate OpenAPI without a real database connection
        run: DATABASE_URL='postgresql://bioflow:bioflow@127.0.0.1:9/bioflow?schema=public' npm run openapi:generate
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: bioflow-openapi
          path: packages/api-client/openapi
          if-no-files-found: error
          retention-days: 1
  native-mobile:
    needs: native-node
    if: vars.NATIVE_MAC_CI_ENABLED == 'true' && github.repository == 'milaniumkz/bioflow' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [milanium-mac-arm64, repo-bioflow]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
