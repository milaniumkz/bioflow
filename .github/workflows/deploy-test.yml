name: deploy-test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      PROD_SSH_HOST: "109.235.118.171"
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER || 'root' }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SSHPASS: ${{ secrets.PROD_SSH_PASSWORD }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y sshpass python3-cryptography
      - name: Build tested application images
        run: |
          docker build -t "bioflow-test-backend:$GITHUB_SHA" -f apps/backend/Dockerfile .
          docker build -t "bioflow-test-web:$GITHUB_SHA" -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=/api/v1 .
          docker save "bioflow-test-backend:$GITHUB_SHA" "bioflow-test-web:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/images.tgz"
          cd "$RUNNER_TEMP"
          sha256sum images.tgz > images.tgz.sha256
      - name: Upload immutable release
        run: |
          source infrastructure/ci-ssh.sh
          git archive --format=tar.gz -o "$RUNNER_TEMP/release.tgz" HEAD
          bioflow_ssh "mkdir -p /opt/bioflow-test/incoming /opt/bioflow-test/releases/$GITHUB_SHA"
          bioflow_scp "$RUNNER_TEMP/images.tgz" "$RUNNER_TEMP/images.tgz.sha256" "$RUNNER_TEMP/release.tgz" "$PROD_SSH_USER@$PROD_SSH_HOST:/opt/bioflow-test/incoming/"
      - name: Launch isolated test services and encrypt owner login
        run: |
          source infrastructure/ci-ssh.sh
          bioflow_ssh bash -s -- "$GITHUB_SHA" > "$RUNNER_TEMP/test-access.json" <<'REMOTE'
          set -euo pipefail
          sha=$1
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          release=/opt/bioflow-test/releases/$sha
          cd /opt/bioflow-test/incoming
          sha256sum -c images.tgz.sha256 >&2
          tar -xzf release.tgz -C "$release"
          if ! command -v docker >/dev/null; then
            . /etc/os-release
            [[ "$ID" = ubuntu && "$VERSION_ID" = 24.04 ]]
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >&2
            apt-get install -y docker.io docker-compose-v2 python3 >&2
            systemctl enable --now docker >&2
          fi
          gzip -dc images.tgz | docker load >&2
          bash "$release/infrastructure/launch-test-server.sh" "$release" "$sha" http://109.235.118.171
          REMOTE
          /usr/bin/python3 infrastructure/encrypt-test-access.py "$RUNNER_TEMP/test-access.json" "$RUNNER_TEMP/BIOFLOW-test-access.html"
          rm -f "$RUNNER_TEMP/test-access.json"
      - name: Verify public web and API
        run: |
          curl --fail --silent --show-error http://109.235.118.171/api/v1/health
          curl --fail --silent --show-error http://109.235.118.171/ > /tmp/bioflow-page.html
          grep -q BIOFLOW /tmp/bioflow-page.html
      - uses: actions/upload-artifact@v4
        with:
          name: BIOFLOW-test-access
          path: ${{ runner.temp }}/BIOFLOW-test-access.html
          retention-days: 7
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get && flutter analyze && flutter test && flutter build apk --debug --dart-define=API_URL=http://109.235.118.171/api/v1
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: BIOFLOW-server-test-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  publish-apk:
    needs: [launch, android]
    runs-on: ubuntu-latest
    environment: production
    env:
      PROD_SSH_HOST: "109.235.118.171"
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER || 'root' }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SSHPASS: ${{ secrets.PROD_SSH_PASSWORD }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BIOFLOW-server-test-apk
          path: apk
      - run: sudo apt-get update -qq && sudo apt-get install -y sshpass
      - name: Publish APK and verify download
        run: |
          source infrastructure/ci-ssh.sh
          bioflow_scp apk/app-debug.apk "$PROD_SSH_USER@$PROD_SSH_HOST:/opt/bioflow-test/shared/downloads/BIOFLOW-test.apk"
          bioflow_ssh 'chmod 644 /opt/bioflow-test/shared/downloads/BIOFLOW-test.apk'
          curl --fail --silent --show-error http://109.235.118.171/downloads/BIOFLOW-test.apk -o /tmp/BIOFLOW-test.apk
          cmp apk/app-debug.apk /tmp/BIOFLOW-test.apk
          echo 'Web: http://109.235.118.171/' >> "$GITHUB_STEP_SUMMARY"
          echo 'APK: http://109.235.118.171/downloads/BIOFLOW-test.apk' >> "$GITHUB_STEP_SUMMARY"
